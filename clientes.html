<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ERP Hardware | Clientes</title>
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">TechFix ERP</div>
        <div class="menu-item"><a href="index.html" style="color:inherit; text-decoration:none;">Dashboard</a></div>
        <div class="menu-item"><a href="equipos.html" style="color:inherit; text-decoration:none;">Registro de Equipos</a></div>
        <div class="menu-item active">Clientes</div>
    </div>
    
    <div class="main-content">
        <h2>Registrar Nuevo Cliente</h2>
        <div class="card">
            <form id="formCliente">
                <input type="text" id="nombre" placeholder="Nombre completo" required style="padding:8px; margin:5px; border-radius:5px;">
                <input type="text" id="telefono" placeholder="Teléfono" required style="padding:8px; margin:5px; border-radius:5px;">
                <input type="email" id="email" placeholder="Correo electrónico" style="padding:8px; margin:5px; border-radius:5px;">
                <input type="text" id="direccion" placeholder="Dirección" style="padding:8px; margin:5px; border-radius:5px;">
                <button type="submit" style="padding:9px; background:#3b82f6; color:white; border:none; cursor:pointer; border-radius:5px;">Guardar Cliente</button>
            </form>
        </div>
    </div>

    <script src="JS/clientes.js"></script>
</body>
</html>
