<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ERP Hardware | Nueva Orden</title>
    <link rel="stylesheet" href="/CSS/estilos.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">TechFix ERP</div>
        <div class="menu-item"><a href="index.html" style="color:inherit; text-decoration:none;">Dashboard</a></div>
        <div class="menu-item active">Nueva Orden</div>
    </div>
    
    <div class="main-content">
        <h2>Crear Orden de Trabajo</h2>
        <div class="card">
            <form id="formOrden">
                <select id="equipoSelect" required style="padding:8px; margin:5px; border-radius:5px; width: 100%;">
                    <option value="">Cargando equipos...</option>
                </select>
                
                <select id="tecnicoSelect" required style="padding:8px; margin:5px; border-radius:5px; width: 100%;">
                    <option value="">Cargando técnicos...</option>
                </select>
                
                <textarea id="problema" placeholder="Problema Reportado por el Cliente" required style="padding:8px; margin:5px; border-radius:5px; width: 100%;"></textarea>
                <textarea id="notas" placeholder="Notas Especiales (Ej. No borrar fotos, requiere cargador)" style="padding:8px; margin:5px; border-radius:5px; width: 100%;"></textarea>
                
                <button type="submit" style="padding:9px; background:#3b82f6; color:white; border:none; cursor:pointer; border-radius:5px;">Generar Orden</button>
            </form>
        </div>
    </div>

    <script src="JS/ordenes.js"></script>
</body>
</html>
