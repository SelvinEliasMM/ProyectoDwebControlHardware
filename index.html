<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Hardware</title>
    <link rel="stylesheet" href="/CSS/estilos.css">
   
</head>
<body>

   
    <div class="sidebar">
        <div class="logo"> TechFix ERP</div>
        <div class="menu-item active"> Dashboard</div>
        <div class="menu-item" id="menu-ordenes"> <a href="ordenes.html" style="color:inherit; text-decoration:none;">Órdenes de Trabajo</a></div>
        <div class="menu-item" id="menu-clientes"><a href="clientes.html" style="color:inherit; text-decoration:none;"> Clientes y Equipos </a></div>
        <div class="menu-item"> Inventario</div>
        <div class="menu-item" id="menu-facturas" > Facturación</div>
    </div>

  
    <div class="main-content">
        <div class="header">
            <h1>Panel de Control</h1>
            <div class="user-info"></div>
        </div>

        <div class="dashboard-cards">
            <div class="card">
                <h3>Órdenes Activas</h3>
                <div class="number" id="count-activas">0</div>
            </div>
            <div class="card warning">
                <h3>En Diagnóstico</h3>
                <div class="number" id="count-diagnostico">0</div>
            </div>
            <div class="card success">
                <h3>Listos para Entrega</h3>
                <div class="number" id="count-listos">0</div>
            </div> 
         </div>

        <div class="table-container">
            <h2>Últimos Equipos Ingresados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Cliente</th>
                        <th>Equipo</th>
                        <th>Estado</th>
                        <th>Técnico</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-ordenes">
                   
                </tbody>
            </table>
        </div>
    </div>

    <script src="JS/index.js"></script>

</body>
</html>
